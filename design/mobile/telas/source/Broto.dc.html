<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%">{{ svg }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:160},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;sleepy&quot;,&quot;excited&quot;,&quot;focused&quot;,&quot;worried&quot;,&quot;celebrating&quot;,&quot;wilted&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stage&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:1,&quot;max&quot;:5,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:24,&quot;max&quot;:240,&quot;default&quot;:120,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;
    const mood = this.props.mood ?? 'ok';
    const stage = Number(this.props.stage ?? 2);
    const size = Number(this.props.size ?? 40);
    const wilt = mood === 'wilted';
    const droop = mood === 'sleepy' || wilt;
    const C = { body: wilt ? '#6DBE9B' : '#10B981', belly: wilt ? '#4FA27F' : '#059669', leaf: wilt ? '#9AD7BB' : '#34D399', stem: '#047857', ink: '#0E1F1A', blue: '#0EA5E9' };
    const st = { stroke: C.ink, strokeWidth: 2.6, strokeLinecap: 'round', fill: 'none' };
    const leafR = (k, ty) => h('g', { key: k, transform: (ty ? `translate(0 ${ty}) ` : '') + (droop ? 'rotate(38 60 36)' : '') },
      h('path', { d: 'M60 36 C60 24 70 17 83 19 C81 32 71 38 60 36 Z', fill: C.leaf }),
      h('path', { d: 'M63 33 C67 29 73 25 79 22', stroke: C.stem, strokeWidth: 1.6, opacity: .5, fill: 'none', strokeLinecap: 'round' }));
    const leafL = (k) => h('path', { key: k, d: 'M60 38 C58 28 49 23 39 25 C41 36 50 40 60 38 Z', fill: C.leaf, transform: droop ? 'rotate(-38 60 38)' : undefined });
    const stem = (top) => h('path', { key: 'stem', d: `M60 47 L60 ${top}`, stroke: C.stem, strokeWidth: 3.5, strokeLinecap: 'round' });
    const back = [];
    if (stage === 1) back.push(h('path', { key: 's', d: 'M60 48 C60 41 64 38 70 39 C69 45 65 48 60 48 Z', fill: C.leaf }));
    if (stage === 2) back.push(stem(36), leafR('r'));
    if (stage === 3) back.push(stem(28), leafR('r', -8), leafL('l'));
    if (stage === 4) [[40,46,16,C.belly],[80,46,16,C.belly],[60,32,19,C.belly],[48,37,11,C.leaf],[72,39,10,C.leaf],[60,24,8,C.leaf]].forEach((c,i)=>back.push(h('circle',{key:'c'+i,cx:c[0],cy:c[1],r:c[2],fill:c[3]})));
    if (stage === 5) {
      back.push(h('rect', { key: 't', x: 56, y: 26, width: 8, height: 26, rx: 3, fill: C.stem }));
      [[36,34,17,C.belly],[84,34,17,C.belly],[60,20,21,C.belly],[48,26,12,C.leaf],[73,28,11,C.leaf],[60,40,9,C.leaf]].forEach((c,i)=>back.push(h('circle',{key:'c'+i,cx:c[0],cy:c[1],r:c[2],fill:c[3]})));
      [[34,30],[56,8],[84,26],[72,42],[44,44],[24,40]].forEach((f,i)=>back.push(h('g',{key:'f'+i},h('circle',{cx:f[0],cy:f[1],r:3.8,fill:C.blue}),h('circle',{cx:f[0],cy:f[1],r:1.4,fill:'#E0F2FE'}))));
    }
    const face = [];
    const eyes = (rx, ry, y) => [50, 70].map(x => h('ellipse', { key: 'e' + x, cx: x, cy: y, rx, ry, fill: C.ink }));
    const extra = [];
    if (mood === 'ok') face.push(...eyes(4, 5.5, 82), h('path', { key: 'm', d: 'M57 92.5 Q60 95 63 92.5', ...st, strokeWidth: 2.2 }));
    if (mood === 'sleepy') {
      face.push(h('path', { key: 'a', d: 'M45.5 83 Q50 86.5 54.5 83', ...st }), h('path', { key: 'b', d: 'M65.5 83 Q70 86.5 74.5 83', ...st }), h('circle', { key: 'm', cx: 60, cy: 94, r: 1.8, fill: C.ink }));
      extra.push(h('text', { key: 'z1', x: 88, y: 58, fontFamily: 'Fredoka', fontWeight: 700, fontSize: 14, fill: '#4A5D57' }, 'z'), h('text', { key: 'z2', x: 98, y: 46, fontFamily: 'Fredoka', fontWeight: 700, fontSize: 10, fill: '#4A5D57' }, 'z'));
    }
    if (mood === 'excited') {
      face.push(...eyes(4.6, 6.2, 82), h('circle', { key: 'g1', cx: 51.6, cy: 79.4, r: 1.7, fill: '#fff' }), h('circle', { key: 'g2', cx: 71.6, cy: 79.4, r: 1.7, fill: '#fff' }), h('path', { key: 'm', d: 'M55.5 90.5 Q60 97.5 64.5 90.5 Z', fill: C.ink }));
      [[100,50],[18,63]].forEach((p,i)=>extra.push(h('path',{key:'sp'+i,d:`M${p[0]-5} ${p[1]} L${p[0]+5} ${p[1]} M${p[0]} ${p[1]-5} L${p[0]} ${p[1]+5}`,stroke:C.blue,strokeWidth:2.6,strokeLinecap:'round'})));
    }
    if (mood === 'focused') {
      face.push(...eyes(3.2, 4.2, 83), h('path', { key: 'm', d: 'M57 95 L63 95', ...st }));
      face.push(h('circle', { key: 'o1', cx: 50, cy: 82, r: 8.5, stroke: C.ink, strokeWidth: 2.4, fill: 'rgba(255,255,255,.3)' }), h('circle', { key: 'o2', cx: 70, cy: 82, r: 8.5, stroke: C.ink, strokeWidth: 2.4, fill: 'rgba(255,255,255,.3)' }), h('path', { key: 'br', d: 'M58.5 81 Q60 79.5 61.5 81', ...st, strokeWidth: 2.4 }));
    }
    if (mood === 'worried') {
      face.push(...eyes(3.8, 5.2, 83), h('path', { key: 'm', d: 'M55 95 Q57.5 93 60 95 Q62.5 97 65 95', ...st }), h('path', { key: 'b1', d: 'M44 74 L54 71', ...st }), h('path', { key: 'b2', d: 'M66 71 L76 74', ...st }));
      extra.push(h('path', { key: 'sw', d: 'M93 62 C93 62 88.5 68 88.5 70.5 A4.5 4.5 0 0 0 97.5 70.5 C97.5 68 93 62 93 62 Z', fill: C.blue }));
    }
    if (mood === 'celebrating') {
      face.push(h('path', { key: 'a', d: 'M45.5 84 Q50 78 54.5 84', ...st, strokeWidth: 2.8 }), h('path', { key: 'b', d: 'M65.5 84 Q70 78 74.5 84', ...st, strokeWidth: 2.8 }), h('path', { key: 'm', d: 'M55 90 Q60 98.5 65 90 Z', fill: C.ink }));
      [[20,52,-20,'#F59E0B'],[100,44,25,C.blue],[12,80,40,'#34D399'],[106,76,-30,'#F59E0B'],[30,30,15,'#34D399'],[92,22,-15,'#F59E0B']].forEach((c,i)=>extra.push(h('rect',{key:'cf'+i,x:c[0]-3.5,y:c[1]-2,width:7,height:4,rx:1.5,fill:c[3],transform:`rotate(${c[2]} ${c[0]} ${c[1]})`})));
    }
    if (wilt) face.push(...eyes(3.6, 3.4, 84), h('path', { key: 'm', d: 'M56.5 95 Q60 92.5 63.5 95', ...st }));
    const lift = mood === 'excited' || mood === 'celebrating' ? 'translate(0 -4)' : undefined;
    const plant = h('g', { transform: stage === 1 ? 'translate(60 108) scale(.82) translate(-60 -108)' : undefined },
      ...back,
      h('path', { d: 'M60 46 C84 46 94 68 94 82 C94 100 79 108 60 108 C41 108 26 100 26 82 C26 68 36 46 60 46 Z', fill: C.body }),
      h('path', { d: 'M27 90 C33 103 47 108 60 108 C78 108 91 101 93 88 C83 100 46 104 27 90 Z', fill: C.belly }),
      h('path', { d: 'M44 59 C44 59 39 65 39 68.5 A5 5 0 0 0 49 68.5 C49 65 44 59 44 59 Z', fill: '#BAE6FD' }),
      ...face);
    const svg = h('svg', { width: size, height: size, viewBox: '0 0 120 120', style: { overflow: 'visible', display: 'block' } },
      h('ellipse', { cx: 60, cy: 112, rx: stage === 1 ? 24 : 30, ry: 4, fill: 'rgba(14,31,26,.10)' }),
      h('g', { transform: lift }, plant), ...extra);
    return { svg };
  }
}
</script>
</body>
</html>
